name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The suite creates a scratch database of its own beside this one, so
        # the role needs CREATEDB — which the default postgres superuser has.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jellygram
          POSTGRES_PASSWORD: ci_password_not_a_secret
          POSTGRES_DB: jellygram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jellygram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jellygram:ci_password_not_a_secret@127.0.0.1:5432/jellygram
      # Long enough to satisfy validation. Not a credential: nothing this job
      # starts is reachable from outside the runner.
      ADMIN_SESSION_SECRET: ci-session-secret-not-used-outside-ci
      LOG_LEVEL: warn
      LOG_TO_FILE: 'false'
      # No bot token, no Jellyfin key, no TMDB key — on purpose. The suite is
      # supposed to pass on a checkout with no credentials at all, and this job
      # is what keeps that true.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The end-to-end suites build real, playable fixtures rather than random
      # bytes, because the pipeline deliberately refuses a file ffprobe cannot
      # read. The runner image does not ship ffmpeg, so install it here rather
      # than let each suite decide what to do without one: with it present,
      # test:uploader and test:recovery can run at all, and the pipeline,
      # multi-part and MTProto suites exercise a genuine video instead of
      # falling back to synthetic bytes. It also puts a real ffprobe on PATH,
      # so the application's own container check is covered too.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Migrate
        run: npm run migrate

      - name: Build tests
        run: npm run build:tests

      - name: Unit and integration tests
        run: npm test

      - name: Frontend tests
        run: npm run test:frontend

      - name: HTTP and header contract
        run: npm run test:http

      - name: End-to-end pipeline
        run: npm run test:e2e

      - name: Multi-part uploads
        run: npm run test:multipart

      - name: MTProto ingestion
        run: npm run test:mtproto

      - name: Direct uploader
        run: npm run test:uploader

      - name: Failure and retry recovery
        run: npm run test:recovery

      # Drives the guided setup through a real pty. It makes its own .env from
      # .env.example and removes it again, so it runs on a checkout with none.
      - name: Guided setup prompts
        run: npm run test:setup

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisory, not gating: a transitive advisory with no fix available should
      # not block an unrelated pull request. Read the output.
      - run: npm audit --audit-level=high
        continue-on-error: true
