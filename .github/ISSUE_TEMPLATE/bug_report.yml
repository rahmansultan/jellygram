name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please redact before pasting.** Logs are redacted for known secret
        values, but the paths, Telegram IDs and library names in them are yours.

        For a security vulnerability, do not use this form — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part
      options:
        - Telegram bot
        - Worker / pipeline
        - Admin dashboard or API
        - Telegram Mini App
        - Direct uploader
        - Multi-part upload
        - MTProto ingestion
        - Jellyfin integration
        - Installation / configuration
        - Deployment (systemd, Docker)
        - Tests
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Please fill in what applies.
      value: |
        - Commit or release:
        - Node (`node -v`):
        - PostgreSQL:
        - Jellyfin:
        - OS:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: |
        Relevant lines from `logs/` or `journalctl --user -u jellygram-worker`.
        If an upload is involved, the output of
        `npm run upload:diagnose -- --upload-id <id>` is usually the most useful
        single thing you can attach.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        Any non-default settings that might matter — TELEGRAM_LOCAL_MODE,
        MEDIA_ROOT layout, whether you are behind a reverse proxy.
        Never paste secrets.
