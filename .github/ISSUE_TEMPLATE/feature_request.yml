name: Feature request
description: Suggest something this project should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing code, it is worth checking
        [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) — it lists a few things
        that are likely to be declined and why. Those are decisions rather than
        commandments, so if you disagree with one, make the argument here first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Including whether an existing setting nearly does it.
